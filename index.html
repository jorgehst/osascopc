<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Marketplace local de produtos e serviços para PC em Osasco e região.">
    <title>Osasco PC Market</title>
    <style>
        /* CONFIGURAÇÕES DE CORES E IDENTIDADE VISUAL ESCURA */
        :root {
            --bg: #07111f;
            --panel: #0e1c30;
            --panel2: #122641;
            --text: #f6f8fb;
            --muted: #aab8ca;
            --brand: #25d6a2;
            --brand2: #58a6ff;
            --line: #203653;
            --danger: #ff806d;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(140deg, #07111f, #0a1728 50%, #07111f);
            color: var(--text);
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .wrap {
            max-width: 1180px;
            margin: auto;
            padding: 0 22px;
        }

        /* CABEÇALHO E MENU */
        .top {
            border-bottom: 1px solid var(--line);
            background: rgba(7, 17, 31, 0.91);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .nav {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -.7px;
        }

        .logo span {
            color: var(--brand);
        }

        .navlinks {
            display: flex;
            gap: 22px;
            color: var(--muted);
        }

        .navlinks a:hover {
            color: #fff;
        }

        /* BOTÕES */
        .btn {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            background: var(--brand);
            color: #05151a;
            font-weight: 800;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn.alt {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
        }

        /* SEÇÃO HERO (BANNER PRINCIPAL) */
        .hero {
            padding: 70px 0 35px;
            display: grid;
            grid-template-columns: 1.12fr .88fr;
            gap: 42px;
            align-items: center;
        }

        .eyebrow {
            color: var(--brand);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            font-size: 12px;
        }

        .hero h1 {
            font-size: clamp(38px, 5vw, 68px);
            line-height: 1.01;
            letter-spacing: -3px;
            margin: 14px 0;
        }

        h1, h2, h3 {
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 18px;
            color: var(--muted);
            line-height: 1.6;
            max-width: 640px;
        }

        /* BARRA DE BUSCA */
        .search {
            display: flex;
            gap: 10px;
            background: var(--panel);
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-top: 28px;
        }

        .search input, .search select {
            background: transparent;
            border: 0;
            outline: 0;
            color: #fff;
            padding: 9px;
            flex: 1;
            min-width: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .search select {
            max-width: 160px;
            border-left: 1px solid var(--line);
            border-radius: 0;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23aab8ca' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            padding-right: 24px;
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .search option {
            background: var(--panel);
            color: #fff;
        }

        /* CARD DE INFORMAÇÕES DO HERO */
        .hero-card {
            background: linear-gradient(145deg, #123656, #0d1e35);
            border: 1px solid #27527b;
            border-radius: 22px;
            padding: 28px;
            box-shadow: var(--shadow);
            transform: rotate(1deg);
        }

        .hero-card .big {
            font-size: 50px;
            font-weight: 900;
            color: var(--brand);
        }

        .hero-card p {
            font-size: 15px;
        }

        .mini {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.11);
            padding: 15px 0;
            color: var(--muted);
        }

        /* GRIDS DE ANÚNCIOS E CARDS */
        .section {
            padding: 34px 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 18px;
        }

        .section h2 {
            font-size: 28px;
            margin: 0 0 5px;
        }

        .muted {
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #3974a5;
        }

        .pic {
            height: 150px;
            background: linear-gradient(135deg, #1c3453, #11223b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 58px;
        }

        .body {
            padding: 16px;
        }

        .tag {
            font-size: 11px;
            color: var(--brand);
            font-weight: 800;
            text-transform: uppercase;
        }

        .card h3 {
            margin: 7px 0;
            font-size: 16px;
        }

        .price {
            font-size: 20px;
            font-weight: 900;
            margin-top: 14px;
        }

        .place {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .service {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .service .card {
            padding: 22px;
        }

        .icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        /* PLANOS DE ANÚNCIOS */
        .plans {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .plan {
            padding: 25px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .plan.featured {
            border-color: var(--brand);
            box-shadow: 0 0 0 1px var(--brand);
        }

        .plan h3 {
            margin: 0;
        }

        .amount {
            font-size: 28px;
            font-weight: 900;
            margin: 16px 0;
        }

        .plan ul {
            padding-left: 19px;
            color: var(--muted);
            line-height: 1.9;
            margin-bottom: 24px;
        }

        .plan .btn {
            width: 100%;
        }

        /* ADSENSE E CTA */
        .ad {
            border: 1px dashed #436078;
            border-radius: 14px;
            color: #7791aa;
            text-align: center;
            padding: 24px;
            margin: 26px 0;
            background: #0b1929;
        }

        .cta {
            background: linear-gradient(100deg, #143f4c, #132c4d);
            border: 1px solid #2e6680;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .cta h2 {
            margin: 0 0 8px;
        }

        /* RODAPÉ */
        .footer {
            border-top: 1px solid var(--line);
            margin-top: 42px;
            padding: 28px 0;
            color: var(--muted);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        /* EXPERIÊNCIA MOBILE / RESPONSIVIDADE */
        @media(max-width: 850px) {
            .hero { grid-template-columns: 1fr; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            .service, .plans { grid-template-columns: 1fr; }
            .navlinks { display: none; }
        }

        @media(max-width: 520px) {
            .grid { grid-template-columns: 1fr; }
            .search { flex-wrap: wrap; }
            .search select { max-width: none; border: 0; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 5px; }
            .cta { display: block; }
            .cta .btn { margin-top: 16px; width: 100%; }
