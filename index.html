    <!-- Chamada para Ação Inferior -->
    <section>
        <h2>Tem um produto ou serviço?</h2>
        <p>Publique e encontre clientes em Osasco.</p>
        <button onclick="abrirModal()">Publicar agora</button>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 OsascoPC. Projeto demonstrativo. 
            <a href="privacidade.html" style="color: inherit; margin-left: 10px;">Privacidade</a> • 
            <a href="privacidade.html" style="color: inherit;">Termos</a> • 
            <a href="mailto:pcosasco@yahoo.com" style="color: inherit;">Contato</a>
        </p>
    </footer>

    <!-- JANELA MODAL DO FORMULÁRIO (BLINDADO COM SUPABASE) -->
    <div id="modalAnuncio" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h2>Publicar anúncio</h2>
            <p>Deixe seus dados e entraremos em contato para ativar seu anúncio.</p>
            
            <form id="formAnuncio">
                <input type="text" id="nome" placeholder="Nome ou empresa" required>
                <input type="text" id="whatsapp" placeholder="WhatsApp" required>
                <textarea id="descricao" placeholder="O que você anuncia?" required></textarea>
                
                <div class="lgpd-box">
                    <input type="checkbox" id="consentimento" required>
                    <label for="consentimento">Aceito os termos da LGPD para armazenamento seguro e publicação dos meus dados de contato.</label>
                </div>
                
                <button type="submit">Enviar interesse</button>
            </form>
        </div>
    </div>

    <!-- Scripts de Conexão com o Supabase -->
    <script src="https://jsdelivr.net"></script>
    <script>
        function abrirModal() {
            document.getElementById('modalAnuncio').style.display = 'flex';
        }
        function fecharModal() {
            document.getElementById('modalAnuncio').style.display = 'none';
        }
        window.onclick = function(event) {
            const modal = document.getElementById('modalAnuncio');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Configuração das Credenciais do seu Projeto OsascoPc
        const SUPABASE_URL = "https://supabase.co";
        
        // SUA CHAVE DEVE SER COLADA EXATAMENTE NA LINHA ABAIXO, ENTRE AS ASPAS:
        const SUPABASE_ANON_KEY = "SUA_CHAVE_PUBLISHABLE_AQUI";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('formAnuncio').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const descricao = document.getElementById('descricao').value;
            const consentimento = document.getElementById('consentimento').checked;

            if (!consentimento) {
                alert("Erro: Você precisa aceitar os termos da LGPD para continuar.");
                return;
            }

            const { data, error } = await supabase
                .from('anuncios')
                .insert([
                    { nome: nome, whatsapp: whatsapp, descricao: descricao, aprovado: false }
                ]);

            if (error) {
                console.error("Erro encontrado:", error);
                alert("Ocorreu um erro ao enviar os dados. Tente novamente mais tarde.");
            } else {
                alert("Sucesso! Seus dados foram guardados com segurança e entraremos em contato em breve.");
                document.getElementById('formAnuncio').reset();
                fecharModal();
            }
        });
    </script>
</body>
</html>
